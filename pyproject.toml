[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iflow2api-sdk"
version = "0.1.0"
description = "Python SDK for iflow2api - iFlow CLI AI Service Client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "iflow2api-sdk contributors" }
]
keywords = [
    "iflow",
    "ai",
    "llm",
    "openai",
    "sdk",
    "chat",
    "completions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/iflow-ai/iflow2api-sdk"
Documentation = "https://github.com/iflow-ai/iflow2api-sdk#readme"
Repository = "https://github.com/iflow-ai/iflow2api-sdk"
Issues = "https://github.com/iflow-ai/iflow2api-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["iflow2api_sdk"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
